version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: code_review_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: code_review_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: code_review_backend
    restart: always
    environment:
      - DATABASE_URL=mysql+pymysql://root:root@db:3306/code_review_db
      - SECRET_KEY=b9c3f4e2a87d1904a6e54c82dbef4093817a02c849d1ef982c73d4a159e60742
      - LLM_API_KEY=${LLM_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: code_review_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
